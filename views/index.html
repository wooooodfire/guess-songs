<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>猜歌大挑戰</title>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="piano.css" />
</head>
<body>

	<!-- Audio -->
	<audio id="sound-A2" src="samples/A2.ogg" preload="auto"></audio>
	<audio id="sound-Bb2" src="samples/Bb2.ogg" preload="auto"></audio>
	<audio id="sound-B2" src="samples/B2.ogg" preload="auto"></audio>
	<audio id="sound-C3" src="samples/C3.ogg" preload="auto"></audio>
	<audio id="sound-Db3" src="samples/Db3.ogg" preload="auto"></audio>
	<audio id="sound-D3" src="samples/D3.ogg" preload="auto"></audio>
	<audio id="sound-Eb3" src="samples/Eb3.ogg" preload="auto"></audio>
	<audio id="sound-E3" src="samples/E3.ogg" preload="auto"></audio>
	<audio id="sound-F3" src="samples/F3.ogg" preload="auto"></audio>
	<audio id="sound-Gb3" src="samples/Gb3.ogg" preload="auto"></audio>
	<audio id="sound-G3" src="samples/G3.ogg" preload="auto"></audio>
	<audio id="sound-Ab3" src="samples/Ab3.ogg" preload="auto"></audio>
	<audio id="sound-A3" src="samples/A3.ogg" preload="auto"></audio>
	<audio id="sound-Bb3" src="samples/Bb3.ogg" preload="auto"></audio>
	<audio id="sound-B3" src="samples/B3.ogg" preload="auto"></audio>
	<audio id="sound-C4" src="samples/C4.ogg" preload="auto"></audio>
	<audio id="sound-Db4" src="samples/Db4.ogg" preload="auto"></audio>
	<audio id="sound-D4" src="samples/D4.ogg" preload="auto"></audio>
	<audio id="sound-Eb4" src="samples/Eb4.ogg" preload="auto"></audio>
	<audio id="sound-E4" src="samples/E4.ogg" preload="auto"></audio>
	<audio id="sound-F4" src="samples/F4.ogg" preload="auto"></audio>
	<audio id="sound-Gb4" src="samples/Gb4.ogg" preload="auto"></audio>
	<audio id="sound-G4" src="samples/G4.ogg" preload="auto"></audio>
	<audio id="sound-Ab4" src="samples/Ab4.ogg" preload="auto"></audio>
	<audio id="sound-A4" src="samples/A4.ogg" preload="auto"></audio>
	<audio id="sound-Bb4" src="samples/Bb4.ogg" preload="auto"></audio>
	<audio id="sound-B4" src="samples/B4.ogg" preload="auto"></audio>
	<audio id="sound-C5" src="samples/C5.ogg" preload="auto"></audio>

	<!-- Lobby -->
	<div id="mainform" class="lobby">
		<div class="lobby-inner">
			<h1 class="page-title">猜歌大挑戰</h1>
			<div class="lobby-columns">
				<div class="lobby-card">
					<h2>玩家加入</h2>
					<form id="roomform" class="form-stack">
						<div class="field">
							<label for="roominput">房間代碼</label>
							<input type="text" id="roominput" placeholder="輸入代碼" autocomplete="off" required />
						</div>
						<div class="field">
							<label for="nameinput">你的名字</label>
							<input type="text" id="nameinput" placeholder="輸入暱稱" autocomplete="off" required />
						</div>
						<button type="submit" class="btn btn-green">進入房間</button>
					</form>
				</div>
				<div class="lobby-card">
					<h2>主持人建立</h2>
					<form id="hostroomform" class="form-stack">
						<div class="field">
							<label for="hostroominput">房間代碼</label>
							<input type="text" id="hostroominput" placeholder="建立代碼" autocomplete="off" required />
						</div>
						<div class="field">
							<label for="hostnameinput">主持人名稱</label>
							<input type="text" id="hostnameinput" placeholder="輸入暱稱" autocomplete="off" required />
						</div>
						<button type="submit" class="btn btn-outline">建立房間</button>
					</form>
				</div>
			</div>
			<div id="errorform"></div>
		</div>
	</div>

	<!-- Host answer -->
	<form id="hostansform" class="host-answer">
		<span>題目答案</span>
		<input id="hostansinput" type="text" placeholder="輸入答案..." autocomplete="off" />
		<button type="submit" class="btn btn-green btn-sm">提交</button>
	</form>

	<!-- Game -->
	<section id="main" class="game">
		<div id="showinfo" class="game-info"></div>
		<div class="score-bar">
			<span class="score-label">得分</span>
			<span class="score-num" id="pointMsg">0</span>
		</div>

		<div class="piano">
			<button id="start" class="btn btn-keyboard">開啟鍵盤聲音</button>
			<noscript class="piano-javascript">需要 Javascript 和 HTML5 Audio 支援。</noscript>
			<div class="piano-container">
				<div class="piano-keys">
					<div class="piano-white piano-A2"><span class="kl">A2</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Bb2"><span class="kl">Bb</span></div></div>
					<div class="piano-white piano-B2"><span class="kl">B2</span></div>
					<div class="piano-white piano-C3"><span class="kl">C3</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Db3"><span class="kl">C#</span></div></div>
					<div class="piano-white piano-D3"><span class="kl">D3</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Eb3"><span class="kl">Eb</span></div></div>
					<div class="piano-white piano-E3"><span class="kl">E3</span></div>
					<div class="piano-white piano-F3"><span class="kl">F3</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Gb3"><span class="kl">F#</span></div></div>
					<div class="piano-white piano-G3"><span class="kl">G3</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Ab3"><span class="kl">Ab</span></div></div>
					<div class="piano-white piano-A3"><span class="kl">A3</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Bb3"><span class="kl">Bb</span></div></div>
					<div class="piano-white piano-B3"><span class="kl">B3</span></div>
					<div class="piano-white piano-C4"><span class="kl">C4</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Db4"><span class="kl">C#</span></div></div>
					<div class="piano-white piano-D4"><span class="kl">D4</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Eb4"><span class="kl">Eb</span></div></div>
					<div class="piano-white piano-E4"><span class="kl">E4</span></div>
					<div class="piano-white piano-F4"><span class="kl">F4</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Gb4"><span class="kl">F#</span></div></div>
					<div class="piano-white piano-G4"><span class="kl">G4</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Ab4"><span class="kl">Ab</span></div></div>
					<div class="piano-white piano-A4"><span class="kl">A4</span></div>
					<div class="piano-black"><div class="piano-black-raised piano-Bb4"><span class="kl">Bb</span></div></div>
					<div class="piano-white piano-B4"><span class="kl">B4</span></div>
					<div class="piano-white piano-C5"><span class="kl">C5</span></div>
				</div>
			</div>
		</div>

		<div class="chat-box">
			<div class="chat-header">聊天室</div>
			<div id="scroller" class="chat-messages">
				<ul id="messages"></ul>
			</div>
			<form id="chatform" class="chat-input">
				<input id="chatinput" autocomplete="off" placeholder="輸入答案..." />
				<button type="submit" class="btn btn-green btn-sm">送出</button>
			</form>
		</div>
	</section>

	<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
	<script src="vendor/jquery-1.7.2.min.js"></script>
	<script src="vendor/jquery-ui-1.8.20.custom.min.js"></script>
	<script src="piano.js"></script>
</body>
</html>
