<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>🎹 猜歌大挑戰</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="piano.css" />
</head>
<body>
	<!-- Animated background particles -->
	<div class="bg-particles" id="particles"></div>

	<div class="app-container">
		<!-- Header -->
		<header class="header">
			<h1 class="logo">
				<span class="logo-icon">🎹</span>
				<span class="logo-text">猜歌大挑戰</span>
			</h1>
			<p class="header-subtitle">聽旋律，猜歌名！</p>
		</header>

		<!-- Audio elements -->
		<audio id="sound-A2" src="samples/A2.ogg" preload="auto"></audio>
		<audio id="sound-Bb2" src="samples/Bb2.ogg" preload="auto"></audio>
		<audio id="sound-B2" src="samples/B2.ogg" preload="auto"></audio>
		<audio id="sound-C3" src="samples/C3.ogg" preload="auto"></audio>
		<audio id="sound-Db3" src="samples/Db3.ogg" preload="auto"></audio>
		<audio id="sound-D3" src="samples/D3.ogg" preload="auto"></audio>
		<audio id="sound-Eb3" src="samples/Eb3.ogg" preload="auto"></audio>
		<audio id="sound-E3" src="samples/E3.ogg" preload="auto"></audio>
		<audio id="sound-F3" src="samples/F3.ogg" preload="auto"></audio>
		<audio id="sound-Gb3" src="samples/Gb3.ogg" preload="auto"></audio>
		<audio id="sound-G3" src="samples/G3.ogg" preload="auto"></audio>
		<audio id="sound-Ab3" src="samples/Ab3.ogg" preload="auto"></audio>
		<audio id="sound-A3" src="samples/A3.ogg" preload="auto"></audio>
		<audio id="sound-Bb3" src="samples/Bb3.ogg" preload="auto"></audio>
		<audio id="sound-B3" src="samples/B3.ogg" preload="auto"></audio>
		<audio id="sound-C4" src="samples/C4.ogg" preload="auto"></audio>
		<audio id="sound-Db4" src="samples/Db4.ogg" preload="auto"></audio>
		<audio id="sound-D4" src="samples/D4.ogg" preload="auto"></audio>
		<audio id="sound-Eb4" src="samples/Eb4.ogg" preload="auto"></audio>
		<audio id="sound-E4" src="samples/E4.ogg" preload="auto"></audio>
		<audio id="sound-F4" src="samples/F4.ogg" preload="auto"></audio>
		<audio id="sound-Gb4" src="samples/Gb4.ogg" preload="auto"></audio>
		<audio id="sound-G4" src="samples/G4.ogg" preload="auto"></audio>
		<audio id="sound-Ab4" src="samples/Ab4.ogg" preload="auto"></audio>
		<audio id="sound-A4" src="samples/A4.ogg" preload="auto"></audio>
		<audio id="sound-Bb4" src="samples/Bb4.ogg" preload="auto"></audio>
		<audio id="sound-B4" src="samples/B4.ogg" preload="auto"></audio>
		<audio id="sound-C5" src="samples/C5.ogg" preload="auto"></audio>

		<!-- Lobby Screen -->
		<div class="lobby" id="mainform">
			<div class="lobby-cards">
				<!-- Player Card -->
				<div class="card card-player">
					<div class="card-icon">🎮</div>
					<h2 class="card-title">玩家加入</h2>
					<p class="card-desc">輸入房間代碼和名字，開始猜歌！</p>
					<form id="roomform" class="card-form">
						<div class="form-group">
							<label for="roominput">房間代碼</label>
							<input
								type="text"
								id="roominput"
								class="input-field"
								placeholder="輸入房間代碼..."
								autocomplete="off"
								required
							/>
						</div>
						<div class="form-group">
							<label for="nameinput">你的名字</label>
							<input
								type="text"
								id="nameinput"
								class="input-field"
								placeholder="輸入暱稱..."
								autocomplete="off"
								required
							/>
						</div>
						<button type="submit" class="btn btn-primary btn-glow">
							🚀 進入房間
						</button>
					</form>
				</div>

				<!-- Host Card -->
				<div class="card card-host">
					<div class="card-icon">🎤</div>
					<h2 class="card-title">主持人建立</h2>
					<p class="card-desc">建立房間，彈鋼琴讓大家猜！</p>
					<form id="hostroomform" class="card-form">
						<div class="form-group">
							<label for="hostroominput">房間代碼</label>
							<input
								type="text"
								id="hostroominput"
								class="input-field"
								placeholder="設定房間代碼..."
								autocomplete="off"
								required
							/>
						</div>
						<div class="form-group">
							<label for="hostnameinput">主持人名稱</label>
							<input
								type="text"
								id="hostnameinput"
								class="input-field"
								placeholder="輸入暱稱..."
								autocomplete="off"
								required
							/>
						</div>
						<button type="submit" class="btn btn-accent btn-glow">
							🎤 建立房間
						</button>
					</form>
				</div>
			</div>

			<div id="errorform" class="error-container"></div>
		</div>

		<!-- Host Answer Form (hidden initially, shown only for hosts) -->
		<div id="hostansform" class="host-answer-bar">
			<div class="host-answer-inner">
				<span class="host-answer-label">🎯 輸入題目答案</span>
				<input id="hostansinput" class="input-field input-answer" type="text" placeholder="答案..." autocomplete="off" />
				<button type="submit" class="btn btn-accent" id="hostansbtn">提交</button>
			</div>
		</div>

		<!-- Game Screen -->
		<section id="main" class="game-screen">
			<!-- Room info bar -->
			<div class="game-topbar">
				<div id="showinfo" class="room-info"></div>
				<div class="score-display">
					<span class="score-label">得分</span>
					<span class="score-value" id="pointMsg">0</span>
				</div>
			</div>

			<!-- Piano -->
			<div class="piano">
				<button id="start" class="btn btn-keyboard-toggle">⌨️ 開啟鍵盤聲音</button>
				<noscript class="piano-javascript">此程式需要 Javascript 和 HTML5 Audio 支援。</noscript>
				<div class="piano-container">
					<div class="piano-keys">
						<div class="piano-white piano-A2"><span class="key-label">A2</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Bb2"><span class="key-label">Bb</span></div></div>
						<div class="piano-white piano-B2"><span class="key-label">B2</span></div>
						<div class="piano-white piano-C3"><span class="key-label">C3</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Db3"><span class="key-label">C#</span></div></div>
						<div class="piano-white piano-D3"><span class="key-label">D3</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Eb3"><span class="key-label">Eb</span></div></div>
						<div class="piano-white piano-E3"><span class="key-label">E3</span></div>
						<div class="piano-white piano-F3"><span class="key-label">F3</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Gb3"><span class="key-label">F#</span></div></div>
						<div class="piano-white piano-G3"><span class="key-label">G3</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Ab3"><span class="key-label">Ab</span></div></div>
						<div class="piano-white piano-A3"><span class="key-label">A3</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Bb3"><span class="key-label">Bb</span></div></div>
						<div class="piano-white piano-B3"><span class="key-label">B3</span></div>
						<div class="piano-white piano-C4"><span class="key-label">C4</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Db4"><span class="key-label">C#</span></div></div>
						<div class="piano-white piano-D4"><span class="key-label">D4</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Eb4"><span class="key-label">Eb</span></div></div>
						<div class="piano-white piano-E4"><span class="key-label">E4</span></div>
						<div class="piano-white piano-F4"><span class="key-label">F4</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Gb4"><span class="key-label">F#</span></div></div>
						<div class="piano-white piano-G4"><span class="key-label">G4</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Ab4"><span class="key-label">Ab</span></div></div>
						<div class="piano-white piano-A4"><span class="key-label">A4</span></div>
						<div class="piano-black"><div class="piano-black-raised piano-Bb4"><span class="key-label">Bb</span></div></div>
						<div class="piano-white piano-B4"><span class="key-label">B4</span></div>
						<div class="piano-white piano-C5"><span class="key-label">C5</span></div>
					</div>
				</div>
			</div>

			<!-- Chat -->
			<div class="chat-container">
				<div class="chat-header">💬 聊天室</div>
				<article id="scroller" class="chat-messages">
					<ul id="messages" class="chat-list"></ul>
				</article>
				<form id="chatform" class="chat-input-bar" action="">
					<input id="chatinput" class="input-field input-chat" autocomplete="off" placeholder="輸入你的答案..." />
					<button type="submit" class="btn btn-primary">送出</button>
				</form>
			</div>
		</section>
	</div>

	<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
	<script src="vendor/jquery-1.7.2.min.js"></script>
	<script src="vendor/jquery-ui-1.8.20.custom.min.js"></script>
	<script src="piano.js"></script>
</body>
</html>
